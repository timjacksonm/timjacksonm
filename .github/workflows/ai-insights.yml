name: Render AI Insights

# ai/insights.json is exported locally (the source data never leaves the
# laptop). Pushing it re-renders the portfolio section and the README cards.
on:
  push:
    paths:
      - ai/insights.json
      - ai/render.mjs
  workflow_dispatch:

permissions:
  contents: write

# A second push while one render is still committing back would race it.
concurrency:
  group: ai-insights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render section and cards
        run: node ai/render.mjs

      - name: Commit rendered pages back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html how-i-use-ai/index.html
          if git diff --cached --quiet; then
            echo "Pages already up to date"
          else
            git commit -m "Render AI insights pages [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish cards to aioutput
        if: github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: aioutput
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload cards for review
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ai-cards
          path: dist/
