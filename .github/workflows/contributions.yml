name: Refresh Contributions Timeline

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the timeline from live contribution data
        run: python3 scripts/build_contributions.py ${{ github.repository_owner }}

      - name: Commit if the data changed
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "No change in contribution data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh contributions timeline"
          git push
